# RC dry-run procedure (run only after the hardening branch and a dated CHANGELOG entry land on main):
#   1. git checkout main && git pull --ff-only && ./scripts/check-release.sh
#   2. git tag -a v1.0.0-rc.N -m "Sigillum 1.0.0-rc.N" && git push origin v1.0.0-rc.N
#   3. Watch this workflow in the Actions tab; the contract job, both verify legs, both artifact jobs, and release job must pass.
#   4. Verify the DRAFT release contains: the .dmg, the .app.zip, both sigillum-cli tar.gz archives, THIRD-PARTY-NOTICES.txt, and SHA256SUMS.
#   5. Download the assets and run: shasum -a 256 --check SHA256SUMS --ignore-missing
#   6. Confirm the release is still a draft and its body contains the dated CHANGELOG section.
#   7. Retain the RC tag and draft assets through final verification; remove only the RC draft after final publication.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag_object: ${{ steps.validate.outputs.tag_object }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag contract
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash ./scripts/check-release-tag-contract.sh "${RELEASE_TAG}" "${RELEASE_SHA}" origin

  verify:
    needs: release-contract
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run release gate
        run: ./scripts/check-release.sh

      - name: Upload browser smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-artifacts-${{ matrix.os }}
          path: |
            /tmp/sigillum-browser-smoke.*/artifacts/
            ${{ runner.temp }}/sigillum-browser-smoke.*/artifacts/
          if-no-files-found: ignore

  artifacts-macos:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate THIRD-PARTY-NOTICES
        run: cargo about generate --locked --output-file crates/sigillum-desktop/THIRD-PARTY-NOTICES.txt about.hbs

      - name: Build desktop bundle
        working-directory: crates/sigillum-desktop
        run: cargo tauri build --config '{"bundle":{"resources":["THIRD-PARTY-NOTICES.txt"]}}' -- --locked

      - name: Build CLI
        run: cargo build --release -p sigillum-cli --locked

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          if [[ "${ARCH}" == "arm64" ]]; then
            ARCH="aarch64"
          fi
          mkdir -p dist

          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/Sigillum_*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one Sigillum dmg, found %s\n' "${#dmg_files[@]}" >&2
            printf 'Matches: %s\n' "${dmg_files[*]:-none}" >&2
            exit 1
          fi

          cp "${dmg_files[0]}" "dist/Sigillum-${TAG}-macos-${ARCH}.dmg"
          ditto -c -k --keepParent target/release/bundle/macos/Sigillum.app "dist/Sigillum-${TAG}-macos-${ARCH}.app.zip"
          tar -czf "dist/sigillum-cli-${TAG}-macos-${ARCH}.tar.gz" -C target/release sigillum
          cp crates/sigillum-desktop/THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-macos
          path: dist/*
          if-no-files-found: error

  artifacts-linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build CLI
        run: cargo build --release -p sigillum-cli --locked

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          mkdir -p dist
          tar -czf "dist/sigillum-cli-${TAG}-linux-${ARCH}.tar.gz" -C target/release sigillum

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [release-contract, artifacts-macos, artifacts-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          if [[ -f CHANGELOG.md ]]; then
            awk -v version="${BASE_VERSION}" '
              $0 ~ "^## \\[" version "\\]" {
                in_section = 1
                next
              }
              in_section && $0 ~ "^## \\[" {
                exit
              }
              in_section {
                print
              }
            ' CHANGELOG.md > "${NOTES_FILE}"
          else
            : > "${NOTES_FILE}"
          fi

          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "CHANGELOG.md section [${BASE_VERSION}] is missing or empty." >&2
            exit 1
          fi

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG_OBJECT: ${{ needs.release-contract.outputs.tag_object }}
        run: |
          set -euo pipefail

          bash ./scripts/check-release-tag-contract.sh "${RELEASE_TAG}" "${RELEASE_SHA}" origin "${RELEASE_TAG_OBJECT}"
          gh release create "${RELEASE_TAG}" --draft --verify-tag --title "Sigillum ${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md" dist/*
