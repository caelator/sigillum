# RC dry-run procedure (run only after the hardening branch and a dated CHANGELOG entry land on main):
#   1. Follow docs/execution-runbook-1.0.md section 6 exactly. It pins GATE_SHA,
#      gates a clean detached checkout, and reasserts origin/main after the long gate.
#   2. Push the annotated RC with the runbook's explicit non-force refspec.
#   3. Watch this workflow in the Actions tab; the contract job, both verify legs, both artifact jobs, and release job must pass.
#   4. Verify the DRAFT release contains: the .dmg, the .app.zip, both sigillum-cli tar.gz archives, THIRD-PARTY-NOTICES.txt, and SHA256SUMS.
#   5. Download the assets and run: shasum -a 256 --check SHA256SUMS --ignore-missing
#   6. Confirm the release is still a draft and its body contains the dated CHANGELOG section.
#   7. Retain the RC tag and draft assets through final verification; remove only the RC draft after final publication.
# Final v1.0.0 promotion is governed by plan H2. Both source-verification legs
# still run, but the artifact jobs are RC-only. The final draft copies the
# contract-selected highest retained RC draft payloads under final filenames,
# regenerates SHA256SUMS, and verifies byte-for-byte and normalized-digest
# equality. Its operator-evidence bundle is uploaded and digest-verified only
# after that exact-byte final draft exists.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag_object: ${{ steps.validate.outputs.tag_object }}
      promotion_rc_tag: ${{ steps.validate.outputs.promotion_rc_tag }}
      promotion_rc_tag_object: ${{ steps.validate.outputs.promotion_rc_tag_object }}
      promotion_rc_sha: ${{ steps.validate.outputs.promotion_rc_sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag contract
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash ./scripts/check-release-tag-contract.sh "${RELEASE_TAG}" "${RELEASE_SHA}" origin

  verify:
    needs: release-contract
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run release gate
        run: ./scripts/check-release.sh

      - name: Upload browser smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-smoke-artifacts-${{ matrix.os }}
          path: |
            /tmp/sigillum-browser-smoke.*/artifacts/
            ${{ runner.temp }}/sigillum-browser-smoke.*/artifacts/
          if-no-files-found: ignore

  artifacts-macos:
    needs: verify
    if: ${{ contains(github.ref_name, '-rc.') }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate THIRD-PARTY-NOTICES
        run: cargo about generate --locked --output-file crates/sigillum-desktop/THIRD-PARTY-NOTICES.txt about.hbs

      - name: Build desktop bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-macos-bundle.sh --config '{"bundle":{"resources":{"THIRD-PARTY-NOTICES.txt":"THIRD-PARTY-NOTICES.txt"}}}' -- --locked

      - name: Verify macOS release bundle
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/Sigillum_*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one Sigillum dmg, found %s\n' "${#dmg_files[@]}" >&2
            exit 1
          fi
          if [[ ! -s target/release/bundle/macos/Sigillum.app/Contents/Resources/THIRD-PARTY-NOTICES.txt ]]; then
            printf 'Release app is missing bundled THIRD-PARTY-NOTICES.txt\n' >&2
            exit 1
          fi
          signing_mode="$(./scripts/check-macos-signing-env.sh)"
          ./scripts/check-macos-bundle-signature.sh \
            --mode "${signing_mode}" \
            target/release/bundle/macos/Sigillum.app \
            "${dmg_files[0]}"

      - name: Build CLI
        run: cargo build --release -p sigillum-cli --locked

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          if [[ "${ARCH}" == "arm64" ]]; then
            ARCH="aarch64"
          fi
          mkdir -p dist

          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/Sigillum_*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one Sigillum dmg, found %s\n' "${#dmg_files[@]}" >&2
            printf 'Matches: %s\n' "${dmg_files[*]:-none}" >&2
            exit 1
          fi

          cp "${dmg_files[0]}" "dist/Sigillum-${TAG}-macos-${ARCH}.dmg"
          ditto -c -k --keepParent target/release/bundle/macos/Sigillum.app "dist/Sigillum-${TAG}-macos-${ARCH}.app.zip"
          tar -czf "dist/sigillum-cli-${TAG}-macos-${ARCH}.tar.gz" -C target/release sigillum
          cp crates/sigillum-desktop/THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-macos
          path: dist/*
          if-no-files-found: error

  artifacts-linux:
    needs: verify
    if: ${{ contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install system dependencies (Linux)
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Build CLI
        run: cargo build --release -p sigillum-cli --locked

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          mkdir -p dist
          tar -czf "dist/sigillum-cli-${TAG}-linux-${ARCH}.tar.gz" -C target/release sigillum

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-linux
          path: dist/*
          if-no-files-found: error

  release:
    needs: [release-contract, verify, artifacts-macos, artifacts-linux]
    if: >-
      ${{
        always() &&
        needs.release-contract.result == 'success' &&
        needs.verify.result == 'success' &&
        (
          (
            contains(github.ref_name, '-rc.') &&
            needs.artifacts-macos.result == 'success' &&
            needs.artifacts-linux.result == 'success'
          ) ||
          (
            ! contains(github.ref_name, '-rc.') &&
            needs.artifacts-macos.result == 'skipped' &&
            needs.artifacts-linux.result == 'skipped'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download release artifacts
        if: ${{ contains(github.ref_name, '-rc.') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        if: ${{ contains(github.ref_name, '-rc.') }}
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Promote exact highest-RC payload bytes
        if: ${{ ! contains(github.ref_name, '-rc.') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          PROMOTION_RC_TAG: ${{ needs.release-contract.outputs.promotion_rc_tag }}
          PROMOTION_RC_TAG_OBJECT: ${{ needs.release-contract.outputs.promotion_rc_tag_object }}
          PROMOTION_RC_SHA: ${{ needs.release-contract.outputs.promotion_rc_sha }}
        run: |
          set -euo pipefail

          [[ "${PROMOTION_RC_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          [[ "${PROMOTION_RC_TAG_OBJECT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PROMOTION_RC_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PROMOTION_RC_SHA}" == "${RELEASE_SHA}" ]]
          GITHUB_OUTPUT="" bash ./scripts/check-release-tag-contract.sh \
            "${PROMOTION_RC_TAG}" "${PROMOTION_RC_SHA}" origin \
            "${PROMOTION_RC_TAG_OBJECT}"

          rc_release="$(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" |
              jq -sc --arg tag "${PROMOTION_RC_TAG}" '
                add
                | [.[] | select(.tag_name == $tag)]
                | if length == 1
                  then .[0]
                  else error("expected exactly one highest-RC release")
                  end
              '
          )"
          bash ./scripts/check-release-state-contract.sh \
            rc-draft "${PROMOTION_RC_TAG}" <<< "${rc_release}"
          jq -e '
            (.assets | length == 6) and
            all(.assets[]; .state == "uploaded" and .size > 0)
          ' <<< "${rc_release}" >/dev/null

          expected_assets="${RUNNER_TEMP}/expected-rc-assets"
          remote_assets="${RUNNER_TEMP}/remote-rc-assets"
          printf '%s\n' \
            "SHA256SUMS" \
            "Sigillum-${PROMOTION_RC_TAG}-macos-aarch64.app.zip" \
            "Sigillum-${PROMOTION_RC_TAG}-macos-aarch64.dmg" \
            "THIRD-PARTY-NOTICES.txt" \
            "sigillum-cli-${PROMOTION_RC_TAG}-linux-x86_64.tar.gz" \
            "sigillum-cli-${PROMOTION_RC_TAG}-macos-aarch64.tar.gz" |
            LC_ALL=C sort > "${expected_assets}"
          jq -r '.assets[].name' <<< "${rc_release}" |
            LC_ALL=C sort > "${remote_assets}"
          cmp -s "${expected_assets}" "${remote_assets}"

          mkdir rc-dist
          while IFS=$'\t' read -r asset_name asset_id; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${REPOSITORY}/releases/assets/${asset_id}" \
              > "rc-dist/${asset_name}"
          done < <(
            jq -r '.assets[] | [.name, (.id | tostring)] | @tsv' \
              <<< "${rc_release}"
          )

          bash ./scripts/promote-release-assets.sh promote \
            "${PROMOTION_RC_TAG}" "${RELEASE_TAG}" rc-dist dist
          bash ./scripts/promote-release-assets.sh verify \
            "${PROMOTION_RC_TAG}" "${RELEASE_TAG}" rc-dist dist
          printf 'promoted exact payload bytes from %s (%s -> %s)\n' \
            "${PROMOTION_RC_TAG}" "${PROMOTION_RC_TAG_OBJECT}" "${PROMOTION_RC_SHA}"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          if [[ -f CHANGELOG.md ]]; then
            awk -v version="${BASE_VERSION}" '
              $0 ~ "^## \\[" version "\\]" {
                in_section = 1
                next
              }
              in_section && $0 ~ "^## \\[" {
                exit
              }
              in_section {
                print
              }
            ' CHANGELOG.md > "${NOTES_FILE}"
          else
            : > "${NOTES_FILE}"
          fi

          if [[ ! -s "${NOTES_FILE}" ]]; then
            echo "CHANGELOG.md section [${BASE_VERSION}] is missing or empty." >&2
            exit 1
          fi

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG_OBJECT: ${{ needs.release-contract.outputs.tag_object }}
          PROMOTION_RC_TAG: ${{ needs.release-contract.outputs.promotion_rc_tag }}
          PROMOTION_RC_TAG_OBJECT: ${{ needs.release-contract.outputs.promotion_rc_tag_object }}
          PROMOTION_RC_SHA: ${{ needs.release-contract.outputs.promotion_rc_sha }}
        run: |
          set -euo pipefail

          if [[ -n "${PROMOTION_RC_TAG}" ]]; then
            GITHUB_OUTPUT="" bash ./scripts/check-release-tag-contract.sh \
              "${PROMOTION_RC_TAG}" "${PROMOTION_RC_SHA}" origin \
              "${PROMOTION_RC_TAG_OBJECT}"
          fi
          GITHUB_OUTPUT="" bash ./scripts/check-release-tag-contract.sh \
            "${RELEASE_TAG}" "${RELEASE_SHA}" origin "${RELEASE_TAG_OBJECT}"

          release_role="final-draft"
          release_args=(
            "${RELEASE_TAG}"
            --draft
            --verify-tag
            --title "Sigillum ${RELEASE_TAG}"
            --notes-file "${RUNNER_TEMP}/release-notes.md"
          )
          if [[ "${RELEASE_TAG}" == *-rc.* ]]; then
            release_role="rc-draft"
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" dist/*

          created_release="$(
            bash ./scripts/await-unique-github-release.sh \
              "${REPOSITORY}" "${RELEASE_TAG}"
          )"
          bash ./scripts/check-release-state-contract.sh \
            "${release_role}" "${RELEASE_TAG}" <<< "${created_release}"
          jq -e '
            (.assets | length == 6) and
            all(.assets[]; .state == "uploaded" and .size > 0)
          ' <<< "${created_release}" >/dev/null
          if [[ -n "${PROMOTION_RC_TAG}" ]]; then
            GITHUB_OUTPUT="" bash ./scripts/check-release-tag-contract.sh \
              "${PROMOTION_RC_TAG}" "${PROMOTION_RC_SHA}" origin \
              "${PROMOTION_RC_TAG_OBJECT}"
          fi
