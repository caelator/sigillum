name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run release gate
        run: ./scripts/check-release.sh

      - name: Upload browser smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts-${{ matrix.os }}
          path: |
            /tmp/sigillum-browser-smoke.*/artifacts/
            ${{ runner.temp }}/sigillum-browser-smoke.*/artifacts/
          if-no-files-found: ignore
