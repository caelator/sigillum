name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  rust:
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Tauri v2 (sigillum-desktop) needs the GTK3/WebKitGTK stack to compile on Linux.
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable snapshot 2026-07-10
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Install Tauri CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run release gate
        env:
          SIGILLUM_ADVERSARIAL_PROPTEST_CASES: ${{ github.event_name == 'schedule' && '1024' || '' }}
        run: ./scripts/check-release.sh

      - name: Prepare artifact action contract fixtures
        shell: bash
        run: bash ./scripts/check-action-artifact-roundtrip.sh prepare "${{ matrix.os }}"

      - name: Upload first artifact action contract fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-contract-first-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/action-artifact-contract/first.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload second artifact action contract fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-contract-second-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/action-artifact-contract/second.txt
          if-no-files-found: error
          retention-days: 1

      - name: Download merged artifact action contract fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: action-contract-*-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/action-artifact-download
          merge-multiple: true

      - name: Verify artifact action contract round-trip
        shell: bash
        run: bash ./scripts/check-action-artifact-roundtrip.sh verify "${{ matrix.os }}"

      - name: Upload browser smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-artifacts-${{ matrix.os }}
          path: |
            /tmp/sigillum-browser-smoke.*/artifacts/
            ${{ runner.temp }}/sigillum-browser-smoke.*/artifacts/
          if-no-files-found: ignore
