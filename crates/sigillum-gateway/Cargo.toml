[package]
name = "sigillum-gateway"
description = "Local-sidecar payment preview and control surface for Sigillum custody"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["payments", "crypto", "stealth-addresses", "gateway"]
categories = ["cryptography", "web-programming"]

[[bin]]
name = "sigillum-gateway"
path = "src/main.rs"

[dependencies]
sigillum-client = { workspace = true }
sigillum-api = { workspace = true }

# Web
axum = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5", features = ["limit"] }
tokio = { workspace = true }
reqwest = { workspace = true }

# Data
rusqlite = { workspace = true }
uuid = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

# Crypto / Auth
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }

# Time
chrono = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

# URL validation
url = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
