[package]
name = "sigillum"
publish = false
description = "Secure secret management with hardware-backed encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["vault", "secrets", "encryption", "security", "fido2"]
categories = ["cryptography", "authentication"]

[dependencies]
sigillum-core = { workspace = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["file-backend"]
file-backend = ["sigillum-core/file-backend"]
