[package]
name = "sigillum-daemon"
publish = false
description = "Sigillum vault daemon with web UI and REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["vault", "daemon", "server", "web-ui"]
categories = ["cryptography", "web-programming"]

[dependencies]
sigillum-api = { workspace = true }
sigillum-core = { workspace = true, features = ["file-backend"] }
sigillum-fido2 = { workspace = true }
sigillum-generator = { workspace = true }
axum = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
