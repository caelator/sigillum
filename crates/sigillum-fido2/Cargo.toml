[package]
name = "sigillum-fido2"
publish = false
description = "FIDO2 hardware key unlock and Shamir secret sharing for Sigillum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["fido2", "hardware-key", "shamir", "security"]
categories = ["cryptography", "authentication"]

[features]
default = ["hid"]
hid = ["ctap-hid-fido2"]

[dependencies]
sigillum-core = { workspace = true, features = ["file-backend"] }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
blahaj = { workspace = true }
chrono = { workspace = true }
ctap-hid-fido2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
