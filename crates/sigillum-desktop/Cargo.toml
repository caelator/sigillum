[package]
name = "sigillum-desktop"
publish = false
description = "Native desktop shell for the Sigillum local daemon console"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "sigillum-desktop"
path = "src/main.rs"

[dependencies]
sigillum-daemon = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
