<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sigillum</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }
    main { max-width: 34rem; padding: 2rem; text-align: center; }
    h1 { margin: 0 0 1rem; font-size: 2rem; }
    p { margin: 0.5rem 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Sigillum</h1>
    <p>Sigillum is starting…</p>
    <p>The console is served by the local Sigillum daemon, and this window will connect to it automatically.</p>
  </main>
</body>
</html>
