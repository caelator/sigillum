[package]
name = "sigillum-cli"
description = "Command-line interface for Sigillum vault management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["vault", "secrets", "cli", "security"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "sigillum"
path = "src/main.rs"

[dependencies]
sigillum-api = { workspace = true }
sigillum-client = { workspace = true }
sigillum-core = { workspace = true, features = ["file-backend"] }
sigillum-daemon = { workspace = true }
sigillum-fido2 = { workspace = true }
secrecy = { workspace = true }
rpassword = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
