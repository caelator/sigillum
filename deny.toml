[advisories]
yanked = "deny"
# Flag unmaintained advisories only for direct workspace dependencies.
# Tauri v2 is inherently bound to the archived gtk-rs GTK3 bindings on
# Linux (wry), which carry blanket unmaintained advisories we cannot act
# on transitively; cargo audit still surfaces them as warnings.
unmaintained = "workspace"
# Mirrors .cargo/audit.toml — quick-xml DoS advisories via plist <- tauri;
# trusted app-owned plists only, no untrusted XML path; no fixed plist
# release exists yet (see docs/production-readiness-audit.md).
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist<-tauri; parses trusted app-owned bundle files only; no upstream fix released yet" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist<-tauri; parses trusted app-owned bundle files only; no upstream fix released yet" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
