[advisories]
yanked = "deny"
# Flag unmaintained advisories only for direct workspace dependencies.
# Tauri v2 is inherently bound to the archived gtk-rs GTK3 bindings on
# Linux (wry), which carry blanket unmaintained advisories we cannot act
# on transitively; cargo audit still surfaces them as warnings.
unmaintained = "workspace"
# Mirrors .cargo/audit.toml — no scoped advisory exceptions currently.
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
