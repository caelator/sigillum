[workspace]
resolver = "2"
members = [
    "crates/sigillum",
    "crates/sigillum-api",
    "crates/sigillum-core",
    "crates/sigillum-client",
    "crates/sigillum-daemon",
    "crates/sigillum-fido2",
    "crates/sigillum-generator",
    "crates/sigillum-cli",
    "crates/sigillum-sdk",
    "crates/sigillum-server",
    "crates/sigillum-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caelator/sigillum"
authors = ["Caelator"]
rust-version = "1.88"

[workspace.dependencies]
# Core
sigillum-api = { path = "crates/sigillum-api", version = "0.1.0" }
sigillum-core = { path = "crates/sigillum-core", version = "0.1.0", default-features = false }
sigillum-client = { path = "crates/sigillum-client", version = "0.1.0" }
sigillum-daemon = { path = "crates/sigillum-daemon", version = "0.1.0" }
sigillum-fido2 = { path = "crates/sigillum-fido2", version = "0.1.0" }
sigillum-generator = { path = "crates/sigillum-generator", version = "0.1.0" }

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.8"
subtle = "2"
k256 = { version = "0.13", features = ["ecdh", "ecdsa", "arithmetic"] }
bip32 = { version = "0.5.2", default-features = false, features = ["secp256k1", "alloc", "std"] }
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
sha3 = "0.10"

# Async
tokio = { version = "1", features = ["full"] }

# Web
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"

# FIDO2 / Shamir
ctap-hid-fido2 = "3.5.9"
blahaj = "0.6"
hex = "0.4"
chrono = "0.4"
rpassword = "7"

# Filesystem
dirs = "5"

# Error handling
thiserror = "2"

# Database
rusqlite = { version = "0.35.0", features = ["bundled"] }

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
